; The validation PC rejects the Wasapi mixer format. XAudio2 opens the
; same output device successfully; this does not change Windows audio settings.
[Audio]
AudioMixerModuleName=AudioMixerXAudio2

; Keep uncooked playtests responsive while the licensed donor library scans.
; This editor-game option does not change cooked asset discovery.
[AssetRegistry]
EditorGameScansAR=Async
